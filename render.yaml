services:
  - type: web
    name: eljawhara
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_URL
        value: https://eljawhara.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENT_MODE
        value: mock
